name: qykw control

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: none

concurrency:
  group: qykw-control-${{ github.repository_id }}-comment-${{ github.event.comment.id }}
  cancel-in-progress: false
  queue: max

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: controller
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Process 停止 command
        working-directory: controller
        env:
          QYKW_REVIEW_TOKEN: ${{ secrets.QYKW_REVIEW_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/qykw"
          python -m tools.qykw --phase control --output "$RUNNER_TEMP/qykw/control-result.json"
      - name: Upload control artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: qykw-${{ github.run_id }}-control-v1
          path: ${{ runner.temp }}/qykw/control-result.json
          retention-days: 1
