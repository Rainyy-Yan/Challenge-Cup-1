name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Display Python version
        run: python --version

      - name: Compile backend modules
        run: >-
          python -m compileall -q
          agents core evalkit tools
          cli.py config.py orchestrator.py server.py

      - name: Run complete backend test suite
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend and generated assets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Display Python version
        run: python --version

      - name: Verify learner frontend
        run: |
          node --check web/view-model.js
          node --check web/app.js
          node --test tests/frontend-ui.test.mjs
          python -m unittest tests.test_server.TestOnlineFrontend -v

  smoke:
    name: Backend service smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Start backend and request the frontend
        shell: bash
        run: |
          set -euo pipefail
          python server.py 8765 >"$RUNNER_TEMP/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/ >"$RUNNER_TEMP/index.html"; then
              break
            fi
            sleep 0.5
          done

          curl --fail --show-error --silent http://127.0.0.1:8765/ >"$RUNNER_TEMP/index.html"
          grep --ignore-case --quiet '<!doctype html>' "$RUNNER_TEMP/index.html"
          curl --fail --silent http://127.0.0.1:8765/styles.css >/dev/null
          curl --fail --silent http://127.0.0.1:8765/view-model.js >/dev/null
          curl --fail --silent http://127.0.0.1:8765/app.js >/dev/null
