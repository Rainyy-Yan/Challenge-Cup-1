name: qykw review

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  issue_comment:
    types:
      - created
  pull_request_review_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        github.event.comment.user.login != vars.MINIMAX_REVIEW_BOT_LOGIN &&
        contains(github.event.comment.body, format('@{0}', vars.MINIMAX_REVIEW_BOT_LOGIN))) ||
      (github.event_name == 'pull_request_review_comment' &&
        github.event.comment.user.login != vars.MINIMAX_REVIEW_BOT_LOGIN &&
        contains(github.event.comment.body, format('@{0}', vars.MINIMAX_REVIEW_BOT_LOGIN)))
    # Job-level concurrency is evaluated only for reviews that pass the guard
    # above, so comments posted by qykw cannot cancel the active review.
    concurrency:
      group: minimax-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Security invariant: always run trusted code from the default branch.
      # Never check out or execute the pull request head in this workflow.
      - name: Check out trusted reviewer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Review pull request with MiniMax
        env:
          GITHUB_TOKEN: ${{ secrets.QYKW_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
          TRIGGER_COMMENT_ID: ${{ github.event.comment.id || '' }}
          TRIGGER_COMMENT_KIND: ${{ github.event_name == 'issue_comment' && 'issue' || github.event_name == 'pull_request_review_comment' && 'review' || '' }}
          REVIEW_REQUEST: ${{ github.event.comment.body || '' }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_BASE_URL: ${{ vars.MINIMAX_BASE_URL || 'https://api.minimaxi.com/v1' }}
          MINIMAX_MODEL: ${{ vars.MINIMAX_MODEL || 'MiniMax-M3' }}
          MINIMAX_REVIEW_BOT_LOGIN: ${{ vars.MINIMAX_REVIEW_BOT_LOGIN }}
        run: python -m tools.minimax_review
